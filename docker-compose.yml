# 双容器部署：Django 应用 + MySQL 8.0
#
#   docker compose up -d --build     构建应用并启动两个容器
#   docker compose ps                查看服务状态
#   docker compose logs -f app       查看应用日志
#   docker compose down              停止容器，保留数据库与业务数据
#   docker compose down -v           停止容器并删除全部数据卷（慎用）

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: recognition-app:latest
    container_name: recognition-app
    restart: unless-stopped
    init: true
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-replace-this-secret-before-production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      IR_SHOW_DEMO_ACCOUNT: ${IR_SHOW_DEMO_ACCOUNT:-1}
      IR_DB_ENGINE: mysql
      IR_DB_NAME: image_recognition
      IR_DB_USER: ir_user
      IR_DB_PASSWORD: ir_pass_2026
      IR_DB_HOST: mysql
      IR_DB_PORT: "3306"
      TZ: Asia/Shanghai
    ports:
      - "8000:8000"
    volumes:
      - recognition_data:/app/backend/data
      - recognition_media:/app/backend/media
    shm_size: 2gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu

  mysql:
    image: mysql:8.0
    container_name: ir-mysql
    restart: unless-stopped
    command:
      # 中文数据必须使用 utf8mb4
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 使用 mysql_native_password，避免部分客户端缺少 cryptography 依赖导致认证失败
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root_pass_2026
      MYSQL_DATABASE: image_recognition          # 容器首次启动时自动建库
      MYSQL_USER: ir_user                        # 自动创建业务账号
      MYSQL_PASSWORD: ir_pass_2026
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"                              # 本机 3306 -> 容器 3306
    volumes:
      - mysql_data:/var/lib/mysql                # 数据持久化，容器删除也不丢数据
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uir_user", "-pir_pass_2026"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

volumes:
  mysql_data:
  recognition_data:
  recognition_media:
